[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstsight"
version = "1.0.0"
description = "Playwright-driven search results harvester with checkpoint recovery and concurrent page scraping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dynamodb = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
firstsight = "serp_harvest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serp_harvest"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
